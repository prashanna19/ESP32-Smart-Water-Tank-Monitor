
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Tank Monitor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: #f1f5f9;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            color: #94a3b8;
            margin-top: 8px;
        }

        .status {
            background: #1e293b;
            padding: 12px 18px;
            border-radius: 10px;
            color: #fbbf24;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: #111c30;
            border: 1px solid #263449;
            border-radius: 18px;
            padding: 25px;
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .tank-container {
            display: flex;
            justify-content: center;
            padding: 15px 0;
        }

        .tank {
            width: 180px;
            height: 300px;
            border: 4px solid #64748b;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            background: #1e293b;
        }

        .water {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #0284c7, #38bdf8);
            transition: height 0.8s ease;
        }

        .tank-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            z-index: 2;
        }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .metric {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
        }

        .metric p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .metric h3 {
            font-size: 30px;
        }

        .unit {
            font-size: 14px;
            color: #94a3b8;
        }

        .footer {
            margin-top: 25px;
            color: #64748b;
            text-align: center;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div>
                <h1>Water Tank Monitor</h1>
                <p>Real-time water level monitoring system</p>
            </div>

            <div class="status" id="connectionStatus">
                ● Disconnected
            </div>
        </header>

        <div class="dashboard">
            <div class="card">
                <h2>Tank Level</h2>

                <div class="tank-container">
                    <div class="tank">
                        <div class="water" id="water"></div>
                        <div class="tank-label" id="tankPercentage">0%</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Live Measurements</h2>

                <div class="metrics">
                    <div class="metric">
                        <p>Water Level</p>
                        <h3 id="waterLevel">-- <span class="unit">cm</span></h3>
                    </div>

                    <div class="metric">
                        <p>Tank Fill</p>
                        <h3 id="fillPercent">-- <span class="unit">%</span></h3>
                    </div>

                    <div class="metric">
                        <p>Sensor Distance</p>
                        <h3 id="distance">-- <span class="unit">cm</span></h3>
                    </div>

                    <div class="metric">
                        <p>Tank Height</p>
                        <h3>27 <span class="unit">cm</span></h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            ESP32 • HC-SR04 • FreeRTOS • MQTT
        </div>
    </div>
     <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <script>
        const brokerHost = window.location.hostname || "localhost";
        const broker = `ws://${brokerHost}:9001`;
        const topic = "water/data";

        const client = mqtt.connect(broker);

        const status = document.getElementById("connectionStatus");
        const water = document.getElementById("water");
        const tankPercentage = document.getElementById("tankPercentage");
        const waterLevel = document.getElementById("waterLevel");
        const fillPercent = document.getElementById("fillPercent");
        const distance = document.getElementById("distance");

        client.on("connect", function () {
            status.innerHTML = "● Connected";
            status.style.color = "#4ade80";

            client.subscribe(topic);
            console.log("Connected to MQTT");
        });

        client.on("message", function (receivedTopic, message) {
            if (receivedTopic === topic) {
                const data = JSON.parse(message.toString());

                const level = Number(data.waterLevel);
                const fill = Number(data.fillPercent);
                const dist = Number(data.distance);

                water.style.height = fill + "%";
                tankPercentage.textContent = fill.toFixed(1) + "%";

                waterLevel.innerHTML =
                    level.toFixed(2) + ' <span class="unit">cm</span>';

                fillPercent.innerHTML =
                    fill.toFixed(2) + ' <span class="unit">%</span>';

                distance.innerHTML =
                    dist.toFixed(2) + ' <span class="unit">cm</span>';

                console.log("Received:", data);
            }
        });

        client.on("error", function (error) {
            console.log("MQTT Error:", error);
            status.innerHTML = "● Connection Error";
            status.style.color = "#f87171";
        });

        client.on("close", function () {
            status.innerHTML = "● Disconnected";
            status.style.color = "#f87171";
        });
    </script>
</body>
</html>
